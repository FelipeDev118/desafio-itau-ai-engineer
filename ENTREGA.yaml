candidato: Luiz Felipe Alves de Oliveira
modelo_usado: openai/gpt-oss-120b
provedor: groq
horas_dedicadas: 2

nivel_1:
  limpeza_dados:      {status: completo, onde: "nivel_1/nivel_1.ipynb, seção 'Parte A.2 — Diagnóstico de qualidade dos dados'"}
  regras_pandas:      {status: completo, onde: "nivel_1/nivel_1.ipynb, seção 'Parte A.5 — Regras determinísticas'"}
  validacao_regras:   {status: completo, onde: "nivel_1/nivel_1.ipynb, seções 'Parte A.6 — Validação da Regra 1' e 'Parte A.6 (cont.) — Validação da Regra 2'", nota: "Regra 1: caso positivo CLI-A-1 vs caso parecido que não se enquadra CLI-A-3, com assert. Regra 2: caso positivo CLI-A-4 vs CLI-A-2 (valor alto em termos absolutos, porém típico para o próprio histórico) e CLI-A-3 (excluído pela guarda de 4+ operações após a limpeza), também com assert."}
  saida_estruturada:  {status: completo, onde: "nivel_1/nivel_1.ipynb, classe ParecerLLM (Pydantic) + função parsear_parecer, com tratamento de resposta malformada"}
  comparacao_prompts: {status: completo, onde: "nivel_1/nivel_1.ipynb, seções 'Prompt v1', 'Prompt v2' e 'Comparação entre as duas versões'"}

nivel_2:
  regras_em_escala: {status: completo, onde: "nivel_2/dados.py; top 10 salvo em outputs/top10_clientes_sinalizados.csv"}
  ferramentas:      {status: completo, onde: "nivel_2/tools.py (historico_cliente, operacoes_do_dia, perfil_canal)"}
  agente:           {status: completo, onde: "nivel_2/agente.py — function calling nativo, o modelo escolhe quais tools chamar", nota: "defeito de prompt corrigido depois da entrega original: clientes com flag_fracionamento nao recebiam a data que disparou a regra e por isso nao chamavam operacoes_do_dia. Corrigido via dados.py:datas_fracionamento + dados.py:montar_flags. Validado: os 2 clientes com fracionamento no top 10 passaram a chamar a ferramenta na data certa (era 0)."}
  lote:             {status: completo, onde: "nivel_2/lote.py; resultados em outputs/pareceres_lote.json e outputs/metricas_lote.csv"}
  confronto:        {status: completo, onde: "nivel_2/confronto.py; resultados em outputs/confronto_regra_vs_agente.csv e outputs/confronto_resumo.json", nota: "metrica corrigida para separar respostas_validas de taxa_concordancia_entre_validas - a versao anterior misturava 'agente discordou' com 'agente nao respondeu' (turnos excedidos) sob a mesma taxa."}

nivel_3:
  trilha_escolhida: B
  status: completo
  onde: "nivel_3/mcp_server.py (servidor MCP stdio), nivel_3/agente_mcp.py (agente consome via MCP, com descoberta de ferramentas em runtime), nivel_3/comparar_transportes.py (validacao); como conectar em docs/ARQUITETURA.md; saidas em outputs/pareceres_lote_mcp.json e outputs/comparacao_transportes.json"
  nota: "As ferramentas do Nivel 2 sao expostas por servidor MCP local via stdio e consumidas pelo protocolo, nao por import direto. Validacao comparou as duas vias: payload das ferramentas identico em 6/6 casos e vocabulario de ferramentas identico."

bonus:
  docker: {status: completo, onde: "Dockerfile, docker-compose.yml, verificar_ambiente.py; ver docs/REPRODUTIBILIDADE.md", nota: "Imagem verificada: reproduz a camada deterministica com os mesmos numeros da entrega, e nao contem a chave de API."}
  observabilidade_custo: {status: completo, onde: "nivel_2/observabilidade.py; saidas em outputs/chamadas_llm.csv e outputs/custo_resumo.json", nota: "Custo e latencia por CHAMADA de API (nao por cliente), separando turno de decisao de ferramenta do turno de resposta final. Preco por token de outputs/custo_resumo.json verificado contra a tabela oficial da Groq (openai/gpt-oss-120b: US$ 0.15/M entrada, US$ 0.60/M saida)."}
  cache_reprodutibilidade: {status: completo, onde: "nivel_2/cache_parecer.py, integrado em nivel_2/agente.py (rodar_agente) e nivel_2/lote.py; cache persistido em outputs/cache_pareceres.json", nota: "Resolve a instabilidade de nivel_risco entre reexecucoes descrita em DECISOES.md: parecer indexado por hash da entrada (cliente + flags + dados + modelo + versao do prompt) e reaproveitado, nao regerado. Validado: confronto.py deu 40% (4/10) em duas execucoes seguidas apos o cache preenchido, contra numero diferente a cada rodada antes. Nao resolve a nao-determinismo do LLM em si - so cache limpo pode gerar parecer diferente do anterior; ver DECISOES.md secao 3 para a correcao estrutural (log append-only)."}
  verificacao_aderencia: {status: completo, onde: "nivel_2/verificacao_aderencia.py, integrado em nivel_2/lote.py; resultado em outputs/aderencia_pareceres.csv", nota: "Grounding check deterministico e SEM LLM: confere se os valores em R$ citados na justificativa existem na base do cliente (operacoes, somas por data, agregados) e se um valor citado como atipico tem de fato flag_valor_atipico. Achado: 3 dos 7 pareceres validos estavam fundamentados na operacao errada - CLI-013 chamou de atipica uma operacao de R$312,54, a menor da base, quando as reais eram de R$28.487,76 e R$26.754,23. Limite: verifica existencia e um contexto especifico, nao o raciocinio inteiro."}
